<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Axioma Watches — Canal de relojoaria quartz e mecânica automática por Claudio Vaz. Informação verdadeira sobre relógios." />
    <title>Axioma Watches</title>

    <!-- pt-BR no .com.br, inglês no .com — mesmo site, idiomas alternativos.
         Sem www: é a forma primária servida pelo Vercel (www.com redireciona p/ apex). -->
    <link rel="alternate" hreflang="pt-BR" href="https://axiomawatches.com.br/" />
    <link rel="alternate" hreflang="en" href="https://axiomawatches.com/" />
    <link rel="alternate" hreflang="x-default" href="https://axiomawatches.com.br/" />
    <script>
      // Canônica dinâmica: cada domínio (pt/en) aponta para si mesmo
      var canonical = document.createElement('link');
      canonical.rel = 'canonical';
      canonical.href = location.origin + '/';
      document.head.appendChild(canonical);
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axioma Watches" />
    <meta property="og:title" content="Axioma Watches" />
    <meta property="og:description" content="Canal de relojoaria quartz e mecânica automática por Claudio Vaz. Informação verdadeira sobre relógios." />
    <meta property="og:locale" content="pt_BR" />
    <!-- ?v=2: o WhatsApp guarda a imagem antiga em cache; mudar o endereço força a nova -->
    <meta property="og:image" content="https://axiomawatches.com.br/og-cover.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Axioma Watches" />
    <meta name="twitter:description" content="Canal de relojoaria quartz e mecânica automática por Claudio Vaz. Informação verdadeira sobre relógios." />
    <meta name="twitter:image" content="https://axiomawatches.com.br/og-cover.png?v=2" />

    <link rel="preload" as="image" href="/hero-bg-soft.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..112,300..800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#0D0E11" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
